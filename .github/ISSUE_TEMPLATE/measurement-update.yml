name: Field measurement update
description: Record verified closet, framing, hardware, Palatine-clearance, and printing data before regeneration.
title: "Field measurements: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include addresses, faces, serial numbers, or other private information in a public issue. The common datum is the intersection of the two finished wall planes. Distances along each wall run outward from that corner.

        Story Corner is an untested hybrid prototype. PETG is finish and ornament only; plywood and steel remain the permanent load path. No tested load rating or embedded G-code is provided.

        Fill MEASUREMENT_WORKSHEET.md first; its section H maps every value below to its exact config.json key. Each field here names the key it feeds.

  - type: input
    id: short_width
    attributes:
      label: Short-wall limiting clear width
      description: Smallest rear/center/front-plane width across every shelf elevation that may be used, in inches. Feeds closet.runs[id=short_wall_3ft].field_verified_min_clear_wall_width_in.
      placeholder: "Example: 35.875 in"
    validations:
      required: true

  - type: input
    id: long_width
    attributes:
      label: Long-wall limiting clear width
      description: Smallest rear/center/front-plane width across every shelf elevation that may be used, in inches. Feeds closet.runs[id=long_wall_5ft].field_verified_min_clear_wall_width_in.
      placeholder: "Example: 59.750 in"
    validations:
      required: true

  - type: input
    id: depth
    attributes:
      label: Verified usable depth
      description: Record wall-to-obstruction depth and selected shelf depth, in inches.
    validations:
      required: true

  - type: input
    id: short_back_offset
    attributes:
      label: Short-wall installed shelf-back offset
      description: Measured finished short wall to its installed plywood back plane, including the real standard, shims, mud, and fastener seating, in inches. Feeds closet.runs[id=short_wall_3ft].field_verified_installed_shelf_back_offset_in.
      placeholder: "Do not copy the catalog projection"
    validations:
      required: true

  - type: input
    id: long_back_offset
    attributes:
      label: Long-wall installed shelf-back offset
      description: Measured finished long wall to its installed plywood back plane, independently of the short-wall value, in inches. Feeds closet.runs[id=long_wall_5ft].field_verified_installed_shelf_back_offset_in.
      placeholder: "Do not assume both walls match"
    validations:
      required: true

  - type: input
    id: corner_angle
    attributes:
      label: Worst included corner angle
      description: The measured included angle furthest from 90.0 across all candidate elevations, in degrees. Feeds closet.inside_corner.field_verified_angle_deg. R5 stops generation beyond ±0.25 degrees deviation.
      placeholder: "Example: 89.82"
    validations:
      required: true

  - type: textarea
    id: corner_geometry
    attributes:
      label: Inside-corner geometry and full-size template
      description: Record the angle at each elevation, wall bow/buildup, and template method. R5 requires deviation within ±0.25 degrees and at least 0.6 mm residual from the 1.6 mm gap.
      placeholder: "Example: residual calculation attached; maximum bow 1/8 in; hardboard template attached"
    validations:
      required: true

  - type: textarea
    id: hardware_envelope
    attributes:
      label: Installed bracket and angle envelope
      description: Record bracket wall-to-tip reach (feeds structural.field_verified_bracket_reach_in, in inches), body width, locks, fasteners, steel-angle fit, and the physical perpendicular dry-fit clearance using the exact hardware.
    validations:
      required: true

  - type: textarea
    id: supports_short
    attributes:
      label: Verified support centers, short wall (3 values)
      description: Absolute distances from the inside-corner datum, in inches, plus stud evidence and material per center. The three numbers feed closet.runs[id=short_wall_3ft].field_verified_support_centers_in.
      placeholder: "Example: 10.5, 22.0, 33.5 — each on a verified stud center"
    validations:
      required: true

  - type: textarea
    id: supports_long
    attributes:
      label: Verified support centers, long wall (4 values)
      description: Absolute distances from the inside-corner datum, in inches, plus stud evidence and material per center, including the nearest through support used for the groin-vault clearance check. The four numbers feed closet.runs[id=long_wall_5ft].field_verified_support_centers_in.
      placeholder: "Example: 6.25, 22.25, 38.25, 54.25 — each on a verified stud or blocking"
    validations:
      required: true

  - type: textarea
    id: groin_clearance
    attributes:
      label: Palatine groin-vault clearance
      description: Record the regenerated and physical clearance between the 42 mm through-owned soffit footprint and the nearest bracket/support plane. The generated development minimum is 10 mm.
    validations:
      required: true

  - type: textarea
    id: electrical
    attributes:
      label: Electrical and hidden-service constraints
      description: Record locating methods, protective plates, wiring, plumbing, and every no-drill area. Do not guess a cable path from an outlet.
    validations:
      required: true

  - type: textarea
    id: elevation
    attributes:
      label: Common elevation and movement zone
      description: Record the common laser datum, candidate elevations, ceiling/door/trim/outlet clearance, full 168.056 mm Palatine fascia envelope, and number of shelf levels sharing the standards.
    validations:
      required: true

  - type: textarea
    id: bins
    attributes:
      label: Bins and contents
      description: Record outside dimensions, quantities, loaded weights, heaviest individual item, and intended distribution.
    validations:
      required: true

  - type: input
    id: dead_loads
    attributes:
      label: Measured shelf-arm dead loads
      description: Weighed dead load of each completed arm, in pounds — return first, then through. Feed closet.runs[id=short_wall_3ft].field_verified_shelf_arm_dead_load_lb and closet.runs[id=long_wall_5ft].field_verified_shelf_arm_dead_load_lb; entered values raise the serviceability check's governing line load.
      placeholder: "Example: return 9.4, through 19.8"
    validations:
      required: false

  - type: textarea
    id: attachment
    attributes:
      label: Finish attachment qualification
      description: Record qualification and removal results for every finish attachment. Fascia uses holeless channel capture; curb/groin screws require safe underside clearance.
      placeholder: "Include silicone/product and surface, channel fit/order, screw details, tile drill paths, depth stop, pull checks, and confirmation that fascia adds no hole or notch to the steel angle."
    validations:
      required: true

  - type: textarea
    id: printer
    attributes:
      label: Confirmed printing setup
      description: Record printer, nozzle diameter/material, build plate, Bambu Studio version, black PETG brand/product, and filament condition.
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Safety acknowledgement
      options:
        - label: I understand the nominal support plan is not a drilling map and no tested load rating is claimed.
          required: true
        - label: I dry-fitted the exact perpendicular brackets and understand both L arms require independent plywood-and-steel support.
          required: true
        - label: I understand a structurally all-PETG shelf is outside this project; Palatine arches and piers are decoration only.
          required: true
        - label: I understand the square-footprint gate is ±0.25 degrees, residual nominal clearance must be at least 0.6 mm, and a full-size template is still required.
          required: true
        - label: I understand no curb or Palatine corner part may bridge the plywood joint and every hanging finish piece needs qualified retention and inspection.
          required: true
