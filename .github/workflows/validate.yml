name: Validate r6 model-only release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r6-model-only-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned geometry dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Audit the immutable publication map
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          python -I -B - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          repository = Path.cwd()
          publication = Path(os.environ["RUNNER_TEMP"]) / "r6-publication"
          if publication.exists():
              raise SystemExit(f"refusing to replace existing path: {publication}")

          manifest_path = repository / "PUBLICATION_MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          publication.mkdir(parents=True)
          for record in manifest["files"]:
              relative = Path(record["destination"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe publication destination: {relative}")
              source = repository / relative
              destination = publication / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          shutil.copy2(manifest_path, publication / manifest_path.name)
          PY
          python -I -B publish_root.py \
            --audit-publication "$RUNNER_TEMP/r6-publication"

      - name: Run source and complete model-only release gates
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          python -B release_check.py --root . --source-only
          python -B release_check.py --root .

      - name: Run the complete r6 test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python -I -B -m unittest discover -s tests -p 'test_*.py'

      - name: Require a read-only validation run
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
