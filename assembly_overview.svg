<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#343a40"/></marker>
    <style>.label{font:20px Arial,sans-serif;fill:#20252a}.small{font:16px Arial,sans-serif;fill:#343a40}.tiny{font:14px Arial,sans-serif;fill:#343a40}.dim{stroke:#343a40;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" fill="#f6f7f8"/>
  <text x="55" y="52" class="label" font-weight="700">Story Corner — 8 in side section and permanent load path</text>
  <rect x="85" y="105" width="60" height="500" fill="#d4a574" stroke="#5d4037" stroke-width="3"/>
  <rect x="145" y="105" width="18" height="500" fill="#e8e8e8" stroke="#777" stroke-width="2"/>
  <rect x="163" y="125" width="28" height="390" fill="#202020" stroke="#000" stroke-width="2"/>
  <text x="53" y="640" class="small">wood stud</text><text x="133" y="675" class="small">wall finish</text>
  <text x="195" y="135" class="small">39 in double-slot steel standard</text>
  <line x1="191" y1="180" x2="112" y2="180" stroke="#333" stroke-width="10"/><line x1="191" y1="455" x2="112" y2="455" stroke="#333" stroke-width="10"/>
  <text x="205" y="190" class="small">manufacturer screws into verified framing</text>
  <rect x="191" y="250" width="510" height="36" fill="#d3aa72" stroke="#5d4037" stroke-width="3"/>
  <rect x="191" y="238" width="510" height="12" fill="#151515" stroke="#000" stroke-width="2"/>
  <text x="365" y="220" class="small">2 mm PETG tiles — finish only</text>
  <path d="M195 238 L240 238 L240 232 L201 232 L201 202 L195 202 Z" fill="#111" stroke="#000" stroke-width="2"/>
  <line x1="285" y1="485" x2="212" y2="235" stroke="#343a40" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="505" class="tiny">rear curb stays on top of deck</text><text x="205" y="525" class="tiny">never behind the steel standard</text>
  <text x="340" y="314" class="small">23/32 in veneer-core plywood</text>
  <path d="M680 286 L680 337 L655 337 L655 286 Z" fill="#666" stroke="#222" stroke-width="3"/>
  <text x="555" y="372" class="small">continuous 1 x 1 x 1/8 in steel front angle</text>
  <path d="M688 235 L720 235 L720 356 L692 356 L692 288 L665 288 L665 352 L688 352 Z" fill="#111" stroke="#000" stroke-width="3"/>
  <text x="728" y="262" class="tiny">removable PETG</text><text x="728" y="283" class="tiny">fascia + 25 mm</text><text x="728" y="304" class="tiny">anti-fall lip</text>
  <path d="M191 286 L191 455 L665 286" fill="none" stroke="#343a40" stroke-width="22" stroke-linejoin="round"/>
  <text x="330" y="430" class="label">7 in steel bracket + lock</text>
  <line x1="191" y1="560" x2="701" y2="560" class="dim"/><text x="395" y="595" class="label">8 in / 203.2 mm</text>
  <rect x="855" y="150" width="285" height="400" rx="12" fill="#fff3cd" stroke="#a67c00" stroke-width="3"/>
  <text x="885" y="195" class="label" font-weight="700">Permanent load path</text>
  <text x="885" y="245" class="label">stored contents</text><text x="885" y="285" class="label">↓ plywood + angle</text>
  <text x="885" y="325" class="label">↓ steel brackets</text><text x="885" y="365" class="label">↓ steel standards</text>
  <text x="885" y="405" class="label">↓ structural screws</text><text x="885" y="445" class="label">↓ verified framing</text>
  <text x="885" y="500" class="small">PETG is intentionally outside</text><text x="885" y="524" class="small">the permanent load path.</text>
</svg>
