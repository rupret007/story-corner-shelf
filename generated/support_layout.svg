    .shelf{fill:#161616;stroke:#000;stroke-width:2} .standard{stroke:#333;stroke-width:8}
    .bracket{fill:none;stroke:#111;stroke-width:9;stroke-linejoin:round} .wall{stroke:#8b9299;stroke-width:5}
