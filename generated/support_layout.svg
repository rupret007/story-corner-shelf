<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720">
  <style>
    .heading{font:700 26px Arial,sans-serif;fill:#16191c} .title{font:700 19px Arial,sans-serif;fill:#222}
