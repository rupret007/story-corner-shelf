<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <style>
    .heading{font:700 26px Arial,sans-serif;fill:#16191c} .title{font:700 17px Arial,sans-serif;fill:#222}
