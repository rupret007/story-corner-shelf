<text x="845" y="238" class="section">Exact path geometry</text>
<text x="845" y="270" class="note">RED: upper wall node (0,154) → front spring (144,46)</text>
<text x="845" y="292" class="note">BLUE: lower wall node (0,30) → integral cap at cassette underside (144,138)</text>
<text x="845" y="314" class="note">Each diagonal: √(144² + 108²) = 180 mm · exact 3:4:5</text>
<text x="845" y="336" class="note">GOLD CRADLE: (0,154) → (27.733333,133.2) in rear cassette</text>
<text x="845" y="358" class="note">Both 12 mm paths union through ≥ 24 mm boss at x=82.666667, y=92</text>
<text x="845" y="390" class="section">What is — and is not — being claimed</text>
<text x="845" y="424" class="note">CANDIDATE CONTINUITY</text>
<text x="845" y="446" class="note">• front spring shoulder → upper wall node</text>
<text x="845" y="468" class="note">• cassette underside / integral bearing cap → lower wall node</text>
<text x="845" y="490" class="note">• crossing boss joins both diagonal paths as one body</text>
<text x="845" y="512" class="note">• upper diagonal is unioned into the cassette-zone rear rib</text>
<text x="845" y="534" class="note"></text>
<text x="845" y="556" class="note">NO CAPACITY CLAIM</text>
<text x="845" y="578" class="note">The PETG corbel is anisotropic and creep-sensitive. These paths may</text>
<text x="845" y="600" class="note">share compression, bending, tension and shear only after exact-orientation</text>
<text x="845" y="622" class="note">coupon, full-corbel, full-bay, destructive and sustained-load testing.</text>
<text x="845" y="644" class="note"></text>
<text x="845" y="666" class="note">WALL BOUNDARY IS FAIL-CLOSED</text>
<text x="845" y="688" class="note">Three red X marks at y = 42 / 84 / 126 mm are provisional targets only.</text>
<text x="845" y="710" class="note">Clearance bores, head/washer pockets, bosses and driver tunnels remain</text>
<text x="845" y="732" class="note">BLOCKED until the exact metal screw, head/washer, embedment, wall finish,</text>
<text x="845" y="754" class="note">driver envelope, verified stud/blocking and utility-clearance method exist.</text>
<text x="845" y="776" class="note"></text>
<text x="845" y="798" class="note">Metal structural screws with suitable heads/washers into verified</text>
<text x="845" y="820" class="note">wood studs or purpose-installed blocking remain the only nonprinted boundary.</text>
