  <text x="52" y="44" class="subtitle">STORY CORNER · TRIADIC PALATINE ORDER · r6</text>
  <text x="52" y="96" class="title">Rear Crown Bridge · Assembly / Service Sequence</text>
  <text x="52" y="122" class="header-subtitle">One upward-inserted hard-stop bridge and one accessible fixed-side anti-drop pin per visible bay</text>
  <rect x="50" y="136" width="1500" height="34" rx="5" class="warning-fill"/>
  <text x="800.0" y="159" class="status" text-anchor="middle">EXPERIMENTAL / UNRATED · NOMINAL / UNVERIFIED · MODEL-ONLY · NO WALL BORES</text>
<rect x="50" y="205" width="275" height="500" rx="8" class="panel"/>
<text x="65" y="236" class="panel-title">1 · Seat both halves</text>
<rect x="347" y="205" width="275" height="500" rx="8" class="panel"/>
<text x="362" y="236" class="panel-title">2 · Retain each half</text>
<rect x="644" y="205" width="275" height="500" rx="8" class="panel"/>
<text x="659" y="236" class="panel-title">3 · Lift bridge</text>
<rect x="941" y="205" width="275" height="500" rx="8" class="panel"/>
<text x="956" y="236" class="panel-title">4 · Meet hard stop</text>
<rect x="1238" y="205" width="275" height="500" rx="8" class="panel"/>
<text x="1253" y="236" class="panel-title">5 · Install one pin</text>
<rect x="80" y="365" width="92" height="42" rx="0" class="petg"/>
<rect x="203" y="365" width="92" height="42" rx="0" class="petg"/>
<line x1="187.5" y1="570" x2="187.5" y2="428" class="construction"/>
<line x1="126" y1="530" x2="126" y2="415" class="motion"/>
<line x1="249" y1="530" x2="249" y2="415" class="motion"/>
<text x="68" y="600" class="label">Lift each half straight upward</text>
<text x="68" y="623" class="label">at its final run coordinate.</text>
<text x="68" y="654" class="small">Two cassette + one spring</text>
<text x="68" y="674" class="small">tenon seat per half.</text>
<rect x="377" y="365" width="92" height="42" rx="0" class="petg"/>
<rect x="500" y="365" width="92" height="42" rx="0" class="petg"/>
<line x1="355" y1="378" x2="387" y2="378" class="motion-blue"/>
<line x1="492" y1="378" x2="524" y2="378" class="motion-blue"/>
<line x1="355" y1="394" x2="387" y2="394" class="motion-blue"/>
<line x1="492" y1="394" x2="524" y2="394" class="motion-blue"/>
<text x="365" y="520" class="label">Insert 3 accessible cross-keys</text>
<text x="365" y="543" class="label">per half; index each 90°.</text>
<text x="365" y="580" class="small">Cross-keys prevent withdrawal only;</text>
<text x="365" y="600" class="small">they carry no shelf load.</text>
<rect x="676" y="300" width="90" height="42" rx="0" class="petg"/>
<rect x="797" y="300" width="90" height="42" rx="0" class="petg"/>
<rect x="723" y="515" width="117" height="90" rx="4" class="petg-soft"/>
<rect x="739" y="490" width="18" height="32" rx="0" class="petg"/>
<rect x="806" y="490" width="18" height="32" rx="0" class="petg"/>
<line x1="781" y1="485" x2="781" y2="365" class="motion"/>
<text x="662" y="630" class="label">Bridge 72 × 48 × 6.4 mm</text>
<text x="662" y="653" class="label">enters only upward from below.</text>
<text x="662" y="680" class="small">No cassette removal required.</text>
<rect x="973" y="300" width="90" height="42" rx="0" class="petg"/>
<rect x="1094" y="300" width="90" height="42" rx="0" class="petg"/>
<rect x="1020" y="342" width="117" height="90" rx="4" class="petg-soft"/>
<line x1="1009" y1="342" x2="1149" y2="342" class="candidate"/>
<text x="959" y="475" class="label">Integral shoulders meet a</text>
<text x="959" y="498" class="label">positive hard stop.</text>
<text x="959" y="540" class="small">Dovetail centers: u = ±28 mm</text>
<text x="959" y="562" class="small">Bridge e envelope: 90…138 mm</text>
<text x="959" y="584" class="small">Swept depth envelope: 42.8 mm</text>
<rect x="1270" y="300" width="90" height="42" rx="0" class="petg"/>
<rect x="1391" y="300" width="90" height="42" rx="0" class="petg"/>
<rect x="1317" y="342" width="117" height="90" rx="4" class="petg-soft"/>
<circle cx="1408" cy="372" r="8" class="crown-node"/>
<line x1="1488" y1="372" x2="1419" y2="372" class="motion-blue"/>
<text x="1256" y="475" class="label">Insert one 5 mm PETG pin</text>
<text x="1256" y="498" class="label">through 5.4 mm double-shear hole</text>
<text x="1256" y="532" class="callout">on RIGHT / fixed half only.</text>
<text x="1256" y="562" class="small">Pin is anti-drop / reverse-slide</text>
<text x="1256" y="582" class="small">retention only; split tail captures positively.</text>
<rect x="50" y="738" width="1460" height="165" rx="8" class="panel"/>
<text x="72" y="772" class="section">Service / removal sequence</text>
<text x="72" y="804" class="note">FULLY UNLOAD → remove ornament → squeeze/pull crown pin → lower bridge along −y → release/turn/withdraw all three cross-keys per half → lower each half vertically at final u.</text>
<text x="72" y="831" class="note">Reserve ≥ 75 mm straight visible-front or open-underside access. Pin center (u,y) = (9.7, 128.3) mm; minimum boss = 19.4 × 19.4 mm; clear ligament = 7.0 mm.</text>
<text x="72" y="858" class="note">PROHIBITED: top-down bridge insertion · second fixed pin · friction-only keeper · hidden wall-side service · assigning shelf-load capacity to the pin.</text>
  <text x="52" y="967" class="small">SCHEMATIC DISPLAY PATHS ONLY — dimensions and parametric data labels govern; no load rating is claimed.</text>
